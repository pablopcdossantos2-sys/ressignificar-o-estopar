name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/course.js
          node --check assets/replay.js


      - name: Validate HTML pages and local links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import re
          import sys

          root = Path(".").resolve()
          pages = sorted(root.glob("*.html"))

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.references = []
                  self.language = None

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag.lower() == "html":
                      self.language = values.get("lang")
                  if "id" in values:
                      self.ids.add(values["id"])
                  for attr in ("href", "src"):
                      value = values.get(attr)
                      if value:
                          self.references.append(value)

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              parsed[page.resolve()] = parser

          problems = []
          for page, parser in parsed.items():
              for ref in parser.references:
                  url = urlsplit(ref)
                  if url.scheme or url.netloc or ref.startswith("//"):
                      continue
                  rel_path = unquote(url.path)
                  target = (page.parent / rel_path).resolve() if rel_path else page
                  if not target.is_file():
                      problems.append(f"{page.relative_to(root)} -> {ref}: file not found")
                      continue
                  if url.fragment and target.suffix.lower() == ".html":
                      target_parser = parsed.get(target)
                      if target_parser and unquote(url.fragment) not in target_parser.ids:
                          problems.append(f"{page.relative_to(root)} -> {ref}: anchor not found")

          for page in pages:
              parser = parsed[page.resolve()]
              if page.stem.endswith("-en") and parser.language != "en":
                  problems.append(f"{page.name}: English page must declare lang=\"en\"")

          for filename, expected, pattern in [
              ("manual.html", 31, r'data-complete-article='),
              ("manual-en.html", 31, r'data-complete-article='),
              ("curso.html", 8, r'data-course-module='),
              ("curso-en.html", 8, r'data-course-module='),
          ]:
              source = (root / filename).read_text(encoding="utf-8")
              actual = len(re.findall(pattern, source))
              if actual != expected:
                  problems.append(f"{filename}: expected {expected} matching elements, found {actual}")

          for filename in ("curso.html", "curso-en.html"):
              source = (root / filename).read_text(encoding="utf-8")
              quizzes = len(re.findall(r'data-course-quiz=', source))
              if quizzes != 8:
                  problems.append(f"{filename}: expected 8 module quizzes/final assessment, found {quizzes}")

          if problems:
              print("\\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print(f"Checked {len(pages)} HTML pages; local files, anchors, language tags, and key course/manual counts are valid.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
